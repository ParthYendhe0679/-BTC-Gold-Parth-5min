# render.yaml — Render deployment configuration
# https://render.com/docs/yaml-spec

services:
  - type: web
    name: btc-trading-alert-bot
    runtime: python
    region: singapore        # closest to most Asian traders; change as needed
    plan: free               # upgrade to starter/standard for production SLAs

    # Build step — install all pinned dependencies
    buildCommand: pip install -r requirements.txt

    # Start command — Render injects $PORT automatically
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Health-check path — Render polls this to confirm the service is up
    healthCheckPath: /

    # Auto-deploy on every push to the linked Git branch
    autoDeploy: true

    # Environment variables — add BOT_TOKEN and CHAT_ID in the Render dashboard
    # (do NOT hardcode secrets here)
    envVars:
      - key: BOT_TOKEN
        sync: false          # managed via Render dashboard / secret files
      - key: CHAT_ID
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
